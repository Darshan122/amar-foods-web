      animation: pulseGlow 2s ease-in-out infinite alternate;

    .logo-container img {

    }
    .splash-subtitle {

      font-weight: 400;
      margin-top: 8px;
      letter-spacing: 0.6px;
      font-family: 'Inter', sans-serif;

    }
    .progress-track {
      width: 240px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      margin-top: 26px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #7b1fa2, #e91e63, #f59e0b);
      border-radius: 6px;
      position: absolute;
      animation: fluidFill 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 12px rgba(233, 30, 99, 0.6);
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(123, 31, 162, 0.2);
        border-color: rgba(255, 255, 255, 0.12);
        transform: scale(0.97);
      }
      100% {
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 45px rgba(123, 31, 162, 0.5);
        border-color: rgba(216, 180, 254, 0.4);
        transform: scale(1.03);
      }
    }

    @keyframes fluidFill {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('splash-loader');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          loader.remove();
          document.body.style.overflow = 'auto';
        }, 700);
      }
    }

    const observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('flt-scene-host')) {
        setTimeout(hideLoader, 500);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    setTimeout(hideLoader, 5000);
  </script>

    window.triggerGoogleTranslate = function(langCode) {
      if (langCode === 'en') {
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;

      }

      var cookieVal = "/en/" + langCode;

      document.cookie = "googtrans=" + cookieVal + "; path=/; domain=" + window.location.hostname;

      var select = document.querySelector('.goog-te-combo');

      } else {
        window.location.reload();
      }
    };
