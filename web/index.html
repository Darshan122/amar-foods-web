<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Amar Foods - Premier Exporter of High-Grade Dehydrated Red, White & Pink Onion & Garlic Products from Mahuva, Gujarat, India.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="amar_food_website">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Amar Foods - Premium Dehydrated Foods & Spices</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Playfair Display, Outfit, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0d0e12;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }
    #splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #181528 0%, #0d0e12 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 36px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(123, 31, 162, 0.25);
      animation: pulseGlow 2s ease-in-out infinite alternate;
    }
    .logo-container img {
      max-width: 100px;
      max-height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }
    .splash-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.8px;
      margin-top: 32px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #d8b4fe, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .splash-subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      font-weight: 400;
      margin-top: 8px;
      letter-spacing: 0.6px;
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    .progress-track {
      width: 240px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      margin-top: 26px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #7b1fa2, #e91e63, #f59e0b);
      border-radius: 6px;
      position: absolute;
      animation: fluidFill 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 12px rgba(233, 30, 99, 0.6);
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(123, 31, 162, 0.2);
        border-color: rgba(255, 255, 255, 0.12);
        transform: scale(0.97);
      }
      100% {
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 45px rgba(123, 31, 162, 0.5);
        border-color: rgba(216, 180, 254, 0.4);
        transform: scale(1.03);
      }
    }

    @keyframes fluidFill {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <!-- Option 2: Shimmering Brand Logo + Liquid Fluid Bar Loader -->
  <div id="splash-loader">
    <div class="logo-container">
      <img src="app_logo.png" alt="Amar Foods Logo" onerror="this.src='favicon.png'">
    </div>
    <div class="splash-title">AMAR FOODS</div>
    <div class="splash-subtitle">Preparing High-Grade Dehydrated Products...</div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('splash-loader');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          loader.remove();
          document.body.style.overflow = 'auto';
        }, 700);
      }
    }

    const observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('flt-scene-host')) {
        setTimeout(hideLoader, 500);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    setTimeout(hideLoader, 5000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
